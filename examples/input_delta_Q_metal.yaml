# Metallic delta_Q demo: thermal (finite-T density matrix) formulation.
#
# Gapped honeycomb (gap 2m = 0.2) with the Fermi level pushed INSIDE the
# lower band (ef = -1.0) — a metal.  The thermal formulation is the
# default; it is spelled out here for clarity.  The RTA transport piece
# is always computed alongside and reported separately as 'delta_Q_tau',
# PER UNIT relaxation time — multiply by your tau, and never sum it into
# the intrinsic 'delta_Q' (extrinsic, diverges in the clean limit).
#
# Finite kT is the regulator of the Fermi-surface structure: converge nk
# together with kT (the thermal shell sharpens as kT -> 0).
system:
  basis: s_u
  lattice_vectors: [[0.8660254037844386, -1.5, 0.0],
                    [0.8660254037844386, 1.5, 0.0],
                    [0.0, 0.0, 20.0]]
  positions:
    - {species: A, coord: [0.0, 0.0, 0.0]}
    - {species: B, coord: [0.0, 1.0, 0.0]}
hopping:
  range: 1.1
  tss_sigma: 1.0
onsite:
  A: {u_s: 0.1}
  B: {u_s: -0.1}
calc:
  type: delta_Q
  formulation: thermal    # default; 'subspace'/'band' are the legacy paths
  nk: [90, 90]
  eflist: [-1.0]          # inside the lower band -> metallic
  kT: 0.1
  components: [yy, yx, xy, xx]
  field_direction: y
  directions: [x, y]
  outputfile: delta_Q_metal_demo
