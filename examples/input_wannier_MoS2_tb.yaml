  # R=0 position diagonal (see docs/user_guide.md, 'wannier_r').
  # wannier_centres: /home/haney411/wrk/qe/MoS2_wannier/mos2_centres.xyz

calc:
  type: band_structure
  kpath:
    points:
      G: [0.0, 0.0, 0.0]
      M: [0.5, 0.0, 0.0]
      K: [0.3333, 0.3333, 0.0]
    path: [G, M, K, G]
    npoints: 100

output:
  file: wannier_MoS2_tb
