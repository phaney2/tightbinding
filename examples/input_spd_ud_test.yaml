system:
  basis: spd_ud
  lattice_vectors: [[1,0,0],[0,0,1],[0,10,0]]
  lattice_type: 2d_square

hopping:
  range: 1.5
  tss_sigma: -0.5
  tsp_sigma: 0.7
  tpp_sigma: 1.0
  tsd_sigma: 0.3
  tpd_sigma: 0.4
  tpd_pi: -0.1
  tdd_sigma: -0.3
  tdd_pi: 0.15
  tdd_delta: 0.05

onsite:
  u_s: 10.0
  u_p: 0.0
  u_d: -1.0
  spinorbit: 0.1
  spinorbit_d: 0.2

calc:
  type: band_structure
  kpath:
    path: [G, X, M, G]
    points:
      G: [0.0, 0.0, 0.0]
      X: [3.14159, 0.0, 0.0]
      M: [3.14159, 0.0, 3.14159]
    npoints: 50
